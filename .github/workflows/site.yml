name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the libraries the HID layer needs
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Test the daemon
        run: cargo test --locked

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The site links each verification record to the commit that added it.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate the catalog and build the site
        run: python3 tools/build.py
      - name: Check the committed images match the catalog
        run: git diff --exit-code -- assets
      - name: Check the device lister runs here
        run: python3 tools/observe.py --no-network
      - name: Check the Web of Things models against the W3C schema
        run: pip install --quiet jsonschema && python3 tools/check_models.py
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: [daemon, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
