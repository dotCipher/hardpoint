[package]
name = "hardpoint"
version = "0.1.0"
edition = "2021"
description = "Cards that tell agents like Claude Code and Codex what each of your devices can do, and what stays with you."
license = "Apache-2.0"
readme = "README.md"
keywords = ["hardware", "agents", "keyboard", "hid", "catalog"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"
