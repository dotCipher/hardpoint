<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 244" width="1000" height="244" role="img" aria-label="The four risk levels"><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}</style><rect width="1000" height="244" rx="16" fill="#0a0c0f"/><rect x="1" y="1" width="998" height="242" rx="15" fill="none" stroke="#232b35" stroke-width="2"/><rect x="24" y="27" width="118" height="28" rx="14" fill="none" stroke="#00d060" stroke-width="1.6"/><text x="83" y="46" fill="#00d060" font-size="14" text-anchor="middle">read</text><text x="164" y="46" fill="#dde3ea" font-size="14">Nothing changes. The value is only read.</text><line x1="24" x2="976" y1="68" y2="68" stroke="#232b35" stroke-dasharray="4 4"/><rect x="24" y="81" width="118" height="28" rx="14" fill="none" stroke="#0090ff" stroke-width="1.6"/><text x="83" y="100" fill="#0090ff" font-size="14" text-anchor="middle">reversible</text><text x="164" y="100" fill="#dde3ea" font-size="14">Changes take effect at once, can be undone at once, and cannot stop you using the machine.</text><line x1="24" x2="976" y1="122" y2="122" stroke="#232b35" stroke-dasharray="4 4"/><rect x="24" y="135" width="118" height="28" rx="14" fill="none" stroke="#ffa000" stroke-width="1.6"/><text x="83" y="154" fill="#ffa000" font-size="14" text-anchor="middle">guarded</text><text x="164" y="154" fill="#dde3ea" font-size="14">Could get in the way of using the machine, so the change is reverted unless you confirm it within a few seconds.</text><line x1="24" x2="976" y1="176" y2="176" stroke="#232b35" stroke-dasharray="4 4"/><rect x="24" y="189" width="118" height="28" rx="14" fill="none" stroke="#ff3b3b" stroke-width="1.6"/><text x="83" y="208" fill="#ff3b3b" font-size="14" text-anchor="middle">gated</text><text x="164" y="208" fill="#dde3ea" font-size="14">Cannot be undone by software, or needs a physical step. Software never does this alone; it only explains what to do.</text></svg>
