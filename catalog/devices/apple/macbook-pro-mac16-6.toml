card = 1

[device]
id = "apple/macbook-pro-mac16-6"
vendor = "Apple"
name = "MacBook Pro (Mac16,6)"
kind = "laptop"
summary = "Apple silicon laptop with an M4 Max chip and a 3024 x 1964 built-in display."
links = ["https://www.apple.com/macbook-pro/"]

[[match]]
bus = "builtin"
model = "Mac16,6"

[[capability]]
id = "battery.level"
adapter = "macos-system"
risk = "read"
params = { source = "power", field = "state_of_charge" }
