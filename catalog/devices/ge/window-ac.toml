card = 1

[device]
id = "ge/window-ac"
vendor = "GE Appliances"
name = "Window air conditioner"
identity = "family"
aliases = ["Window AC"]
kind = "climate"
summary = "Window air-conditioner family advertised as Window AC. That announcement does not establish the exact retail model or a working control route. GE says it discontinued HomeKit support; a legacy announcement is not proof of current compatibility."
links = ["https://products.geappliances.com/appliance/gea-support-search-content?contentId=37108"]

[[requires]]
platform = "any"
what = "Confirm the public model and its actual integration route. The maker's discontinued HomeKit support must not be inferred from an announcement alone."

[[sources]]
title = "GE Appliances: current smart-air-conditioner / HomeKit support notice"
url = "https://products.geappliances.com/appliance/gea-support-search-content?contentId=37108"

[[match]]
bus = "network"
service = "_hap._tcp"
model = "Window AC"

[[requires]]
platform = "any"
what = "The air conditioner added to a Home Assistant server"
note = "Home Assistant pairs with it as a HomeKit device, using the setup code on the unit."

[[capability]]
id = "climate.temperature"
adapter = "home-assistant"
risk = "read"
verification = [{ status = "unverified", platform = "macos", note = "Home Assistant offers this for an air conditioner. The unit was seen on the network but not added to Home Assistant, so nothing was read." }]

[[capability]]
id = "climate.target"
adapter = "home-assistant"
risk = "reversible"
verification = [{ status = "unverified", platform = "macos", note = "Home Assistant offers this for an air conditioner. Not tried." }]

[[capability]]
id = "power.switch"
adapter = "home-assistant"
risk = "reversible"
verification = [{ status = "unverified", platform = "macos", note = "Home Assistant offers this for an air conditioner. Not tried." }]

[[sources]]
title = "Home Assistant: climate devices"
url = "https://www.home-assistant.io/integrations/climate/"
