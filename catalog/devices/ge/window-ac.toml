card = 1

[device]
id = "ge/window-ac"
vendor = "GE Appliances"
name = "Window air conditioner"
kind = "climate"
summary = "Window air conditioner that joins the home network as a HomeKit accessory. Nobody has checked this card through Home Assistant yet."
links = ["https://www.geappliances.com/"]

[[match]]
bus = "network"
service = "_hap._tcp"
model = "Window AC"

[[requires]]
platform = "any"
what = "The air conditioner added to a Home Assistant server"
note = "Home Assistant pairs with it as a HomeKit device, using the setup code on the unit."

[[capability]]
id = "climate.temperature"
adapter = "home-assistant"
risk = "read"
verification = [{ status = "unverified", platform = "macos", note = "Home Assistant offers this for an air conditioner. The unit was seen on the network but not added to Home Assistant, so nothing was read." }]

[[capability]]
id = "climate.target"
adapter = "home-assistant"
risk = "reversible"
verification = [{ status = "unverified", platform = "macos", note = "Home Assistant offers this for an air conditioner. Not tried." }]

[[capability]]
id = "power.switch"
adapter = "home-assistant"
risk = "reversible"
verification = [{ status = "unverified", platform = "macos", note = "Home Assistant offers this for an air conditioner. Not tried." }]

[[sources]]
title = "Home Assistant: climate devices"
url = "https://www.home-assistant.io/integrations/climate/"
