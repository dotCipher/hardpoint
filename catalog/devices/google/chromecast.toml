card = 1

[device]
id = "google/chromecast"
vendor = "Google"
name = "Chromecast"
identity = "family"
kind = "media"
summary = "Google Cast media-player family advertised as Chromecast. The announcement does not establish its generation, enclosure shape or resolution; do not assume a stick-shaped device or a particular video specification."
links = ["https://support.google.com/chromecast/answer/3046409?hl=en"]

[[sources]]
title = "Google: Chromecast and Google TV Streamer specifications (models differ)"
url = "https://support.google.com/chromecast/answer/3046409?hl=en"

[[match]]
bus = "network"
service = "_googlecast._tcp"
model = "Chromecast"

# A Chromecast tells the whole local network what it is playing. The card
# lets only "something is playing" through, never the title.
[[capability]]
id = "media.playing"
adapter = "mdns"
risk = "read"
privacy = "presence"
params = { service = "_googlecast._tcp", field = "rs" }
note = "The device announces what it is playing to everyone on the network. Only whether something is playing may be passed on."
verification = [{ status = "observed", platform = "macos", os = "27.2", date = 2026-11-14, note = "The announcement changed with what was playing. Read by listening once; the adapter is not written yet." }]

[[capability]]
id = "audio.output_volume"
adapter = "home-assistant"
risk = "reversible"
verification = [{ status = "unverified", platform = "macos", note = "Home Assistant offers volume for Cast devices. Not tried." }]

[[sources]]
title = "Home Assistant: Google Cast"
url = "https://www.home-assistant.io/integrations/cast/"
