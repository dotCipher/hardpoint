card = 1

# A class card. It is not one model: it gives every device Home Assistant
# classes this way the same labels, until a card for the exact model says more.

[device]
id = "home-assistant/light"
vendor = "Home Assistant"
name = "Light"
identity = "class"
kind = "lighting"
summary = "A light entity exposed through Home Assistant. This describes an integration class, not a manufacturer or physical model; availability depends on the entity's route and supported features."
links = ["https://www.home-assistant.io/integrations/light/"]

[[match]]
bus = "home-assistant"
domain = "light"

[[requires]]
platform = "any"
what = "A Home Assistant server that this computer may talk to"

[[capability]]
id = "power.switch"
adapter = "home-assistant"
risk = "reversible"
verification = [{ status = "unverified", platform = "macos", note = "Home Assistant documents turning a light on and off. Not tried: the adapter is not written." }]

[[capability]]
id = "light.brightness"
adapter = "home-assistant"
risk = "reversible"
verification = [{ status = "unverified", platform = "macos", note = "Home Assistant documents setting a light's brightness. Not tried: the adapter is not written." }]
