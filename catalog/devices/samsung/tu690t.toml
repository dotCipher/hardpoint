card = 1

[device]
id = "samsung/tu690t"
vendor = "Samsung"
name = "TU690T 4K TV"
kind = "television"
summary = "Smart television on the home network. This card is for the model that announces itself as UTU690T."
links = ["https://www.samsung.com/"]

[[match]]
bus = "network"
service = "_airplay._tcp"
model = "UTU690T"

[[capability]]
id = "identity.firmware"
adapter = "mdns"
risk = "read"
params = { service = "_airplay._tcp", field = "fv" }
verification = [{ status = "observed", platform = "macos", os = "27.2", date = 2026-11-14, note = "The TV announces a firmware version on the local network. Read by listening once; the adapter is not written yet." }]
