card = 1

[device]
id = "seagate/expansion-2322"
vendor = "Seagate"
name = "Expansion external drive"
identity = "family"
kind = "storage"
summary = "Expansion-family external USB storage reporting product ID 0x2322. The card does not establish capacity or a portable-versus-desktop enclosure; do not infer those from the family name."
links = ["https://www.seagate.com/support/kb/how-to-use-your-seagate-expansion-drive-007769en/"]

[[sources]]
title = "Seagate: using Expansion drives (family reference, not enclosure identification)"
url = "https://www.seagate.com/support/kb/how-to-use-your-seagate-expansion-drive-007769en/"

[[match]]
bus = "usb"
vendor_id = 0x0bc2
product_id = 0x2322

[[requires]]
platform = "macos"
what = "When run as a login service, Hardpoint may need removable-volume access in System Settings, Privacy & Security, Files and Folders"

[[capability]]
id = "storage.health"
adapter = "macos-system"
risk = "read"
params = { source = "storage", field = "smart_status" }
note = "Not every USB drive passes its health verdict through to the computer. This one does."
verification = [{ status = "tested", platform = "macos", os = "27.2", date = 2026-11-15, note = "Read through the adapter." }, { status = "observed", platform = "macos", os = "27.2", date = 2026-11-14, note = "macOS reported the drive's own verdict over USB. Read by hand; the adapter is not written yet." }]
