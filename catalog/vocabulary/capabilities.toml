# The shared vocabulary. A capability id means the same thing on every device,
# so a rule or an agent can ask for "battery.level" without knowing the hardware.
#
# kind:     reading (a value you can read), event (a stream), control (a value
#           you can set), action (something you can trigger once)
# value:    the type of the value, with its unit where it has one
# min_risk: the lowest risk level a device card may claim for it
# privacy:  the least a card must promise about what leaves the adapter
# harm:     required for anything guarded or gated: what goes wrong, in plain
#           words, if it is done carelessly
#
# For the examples people see on the site. Leave these out for abilities
# nobody would ask for in everyday words.
# ask:      something a person would really say to an agent
# example:  an illustrative answer. Not a reading
# example_before: for something you can change, an illustrative value before
# swatch:   for colours, the colour the example names

[capability."identity.firmware"]
kind = "reading"
value = "string"
summary = "Firmware version or layout identifier the device reports."
min_risk = "read"

[capability."keys.position_events"]
kind = "event"
value = "key position, down or up"
summary = "Every key press and release, by physical position."
min_risk = "read"
privacy = "aggregate"
ask = "Let me answer my agent by pressing a spare key."
example = "spare key pressed"

[capability."keys.layer"]
kind = "event"
value = "layer number"
summary = "The active keymap layer, reported when it changes."
min_risk = "read"

[capability."keys.layer_set"]
kind = "control"
value = "layer number"
summary = "Switch the active keymap layer from the host."
min_risk = "guarded"
harm = "Every key suddenly types something else, including the keys you would use to switch back."

[capability."light.per_key"]
kind = "control"
value = "rgb per key"
summary = "Set the colour of an individual key."
min_risk = "reversible"
ask = "Light up a key when my agent needs me."
example = "amber"
example_before = "off"
swatch = "#ffa000"

[capability."light.global"]
kind = "control"
value = "rgb"
summary = "Set every light on the device to one colour, or hand lighting back to the firmware."
min_risk = "reversible"
ask = "Glow amber whenever an agent is waiting on me."
swatch = "#ffa000"
example = "amber"
example_before = "off"


[capability."light.status"]
kind = "control"
value = "on or off per indicator"
summary = "Switch the device's separate indicator lights."
min_risk = "reversible"

[capability."firmware.flash"]
kind = "action"
value = "firmware image"
summary = "Replace the device's firmware."
min_risk = "gated"
ask = "Update its software."
example = "updated"
harm = "If an update fails part-way, the device may not start again."

[capability."battery.level"]
kind = "reading"
value = "percent"
summary = "Charge remaining."
min_risk = "read"
ask = "Put it on my keyboard when this is about to die."
example = "20%"

[capability."battery.charging"]
kind = "reading"
value = "boolean"
summary = "Whether the battery is charging."
min_risk = "read"

[capability."battery.cycles"]
kind = "reading"
value = "count"
summary = "Charge cycles so far."
min_risk = "read"

[capability."battery.health"]
kind = "reading"
value = "percent"
summary = "Capacity now, relative to when the battery was new."
min_risk = "read"
ask = "Is this battery worn enough to replace?"
example = "92%"

[capability."storage.health"]
kind = "reading"
value = "status"
summary = "The drive's own health verdict."
min_risk = "read"
ask = "Is this drive about to fail? Check before I back up to it."
example = "healthy"

[capability."thermal.pressure"]
kind = "reading"
value = "level"
summary = "Whether the system is limiting performance because of heat."
min_risk = "read"
ask = "Is heat slowing my computer down right now?"
example = "no"

[capability."audio.output_volume"]
kind = "control"
value = "percent"
summary = "Output volume."
min_risk = "reversible"
ask = "Drop the volume whenever an agent needs me."
example = "30%"
example_before = "50%"

[capability."pointer.dpi"]
kind = "control"
value = "dots per inch"
summary = "Pointer sensitivity."
min_risk = "guarded"
ask = "Slow the pointer right down while I draw this."
harm = "A pointer that is suddenly far too fast or too slow can be too hard to steer to undo it."
example = "slow"
example_before = "normal"


[capability."pointer.buttons"]
kind = "control"
value = "button to software"
summary = "Send a button's presses to software instead of its built-in action."
min_risk = "guarded"
ask = "Make the side button mute my microphone."
example = "mutes the mic"
example_before = "goes back"
harm = "A button stops doing what your hand expects, and it may be the one you would undo it with."

[capability."pointer.host"]
kind = "control"
value = "host number"
summary = "Move the device to another paired computer."
min_risk = "gated"
harm = "The device leaves this computer, and nothing here can reach it to bring it back."

[capability."scroll.mode"]
kind = "control"
value = "ratchet or free-spin"
summary = "How the scroll wheel behaves."
min_risk = "reversible"
ask = "Let the wheel spin freely while I read this long file."
example = "free-spin"
example_before = "ratchet"


[capability."display.input"]
kind = "control"
value = "input source"
summary = "Which video input the display shows."
min_risk = "guarded"
ask = "Switch the screen to my other computer."
example = "other computer"
example_before = "this computer"
harm = "The picture leaves the computer that asked, so you cannot see what you are doing to switch back."

[capability."display.brightness"]
kind = "control"
value = "percent"
summary = "Display brightness."
min_risk = "reversible"
ask = "Dim the screen at eight every evening."
example = "40%"
example_before = "80%"

# Things on the home network.

[capability."media.playing"]
kind = "reading"
value = "playing or idle"
summary = "Whether something is playing."
min_risk = "read"
privacy = "presence"
ask = "Is anything still playing in the other room?"
example = "yes"

[capability."climate.temperature"]
kind = "reading"
value = "degrees"
summary = "The temperature the device measures."
min_risk = "read"

[capability."climate.target"]
kind = "control"
value = "degrees"
summary = "The temperature the device aims for."
min_risk = "reversible"
ask = "Make it cooler in here."
example = "21°"
example_before = "24°"

[capability."power.switch"]
kind = "control"
value = "on or off"
summary = "Switch the device itself on or off."
min_risk = "reversible"
ask = "Switch it off. I am heading out."
example = "off"
example_before = "on"

[capability."power.outlet"]
kind = "control"
value = "on or off"
summary = "Switch power to whatever is plugged into the device."
min_risk = "gated"
ask = "Turn off the plug by my desk."
example = "off"
example_before = "on"
harm = "Whatever is plugged in loses power at once. It may be a lamp. It may be a computer, a fridge or a server."

[capability."light.brightness"]
kind = "control"
value = "percent"
summary = "How bright a light is."
min_risk = "reversible"
ask = "Dim the lights for the film."
example = "30%"
example_before = "100%"

[capability."access.unlock"]
kind = "action"
value = "none"
summary = "Unlock a door."
min_risk = "gated"
ask = "Unlock the front door."
example = "unlocked"
harm = "The door stays open to anyone until somebody locks it again."
