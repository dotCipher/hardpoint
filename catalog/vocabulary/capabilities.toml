# The shared vocabulary. A capability id means the same thing on every device,
# so a rule or an AI can ask for "battery.level" without knowing the hardware.
#
# kind:     reading (a value you can read), event (a stream), control (a value
#           you can set), action (something you can trigger once)
# value:    the type of the value, with its unit where it has one
# min_risk: the lowest risk level a device card may claim for it
# privacy:  the least a card must promise about what leaves the adapter
# ask:      how a person would ask for it, in everyday words
# example:  an illustrative value, for explanations and demos. Not a reading.
# example_before: for something you can change, an illustrative value before
# swatch:   for colours, the colour the example names
# harm:     required for anything guarded or gated: what goes wrong, in plain
#           words, if it is done carelessly

[capability."identity.firmware"]
kind = "reading"
value = "string"
summary = "Firmware version or layout identifier the device reports."
min_risk = "read"
ask = "Which version of its software is it running?"
example = "version 4.5"

[capability."keys.position_events"]
kind = "event"
value = "key position, down or up"
summary = "Every key press and release, by physical position."
min_risk = "read"
privacy = "aggregate"
ask = "Tell me when a spare key is pressed."
example = "a key was pressed"

[capability."keys.layer"]
kind = "event"
value = "layer number"
summary = "The active keymap layer, reported when it changes."
min_risk = "read"
ask = "Which set of keys is active?"
example = "the main set"

[capability."keys.layer_set"]
kind = "control"
value = "layer number"
summary = "Switch the active keymap layer from the host."
min_risk = "guarded"
ask = "Switch the keyboard to its numbers layout."
example = "numbers"
example_before = "letters"
harm = "Every key suddenly types something else, including the keys you would use to switch back."

[capability."light.per_key"]
kind = "control"
value = "rgb per key"
summary = "Set the colour of an individual key."
min_risk = "reversible"
ask = "Light up one key in amber."
example = "amber"
example_before = "off"
swatch = "#ffa000"

[capability."light.global"]
kind = "control"
value = "rgb"
summary = "Set every light on the device to one colour, or hand lighting back to the firmware."
min_risk = "reversible"
ask = "Make the whole keyboard glow blue."
example = "blue"
example_before = "off"
swatch = "#0090ff"

[capability."light.status"]
kind = "control"
value = "on or off per indicator"
summary = "Switch the device's separate indicator lights."
min_risk = "reversible"
ask = "Turn on its little indicator light."
example = "on"
example_before = "off"

[capability."firmware.flash"]
kind = "action"
value = "firmware image"
summary = "Replace the device's firmware."
min_risk = "gated"
ask = "Install new software on the device itself."
example = "new software installed"
harm = "If the install fails part-way, the device may not start again."

[capability."battery.level"]
kind = "reading"
value = "percent"
summary = "Charge remaining."
min_risk = "read"
ask = "How much charge is left?"
example = "20%"

[capability."battery.charging"]
kind = "reading"
value = "boolean"
summary = "Whether the battery is charging."
min_risk = "read"
ask = "Is it charging?"
example = "yes"

[capability."battery.cycles"]
kind = "reading"
value = "count"
summary = "Charge cycles so far."
min_risk = "read"
ask = "How many times has the battery been through a full charge?"
example = "101 times"

[capability."battery.health"]
kind = "reading"
value = "percent"
summary = "Capacity now, relative to when the battery was new."
min_risk = "read"
ask = "Is the battery wearing out?"
example = "92%"

[capability."storage.health"]
kind = "reading"
value = "status"
summary = "The drive's own health verdict."
min_risk = "read"
ask = "Is the drive healthy?"
example = "healthy"

[capability."thermal.pressure"]
kind = "reading"
value = "level"
summary = "Whether the system is limiting performance because of heat."
min_risk = "read"
ask = "Is it running hot?"
example = "no"

[capability."audio.output_volume"]
kind = "control"
value = "percent"
summary = "Output volume."
min_risk = "reversible"
ask = "Turn the volume down."
example = "30%"
example_before = "50%"

[capability."pointer.dpi"]
kind = "control"
value = "dots per inch"
summary = "Pointer sensitivity."
min_risk = "guarded"
ask = "Make the pointer move faster."
example = "fast"
example_before = "normal"
harm = "A pointer that is suddenly far too fast or too slow can be too hard to steer to undo the change."

[capability."pointer.buttons"]
kind = "control"
value = "button to software"
summary = "Send a button's presses to software instead of its built-in action."
min_risk = "guarded"
ask = "Let the side button answer my AI."
example = "answers the AI"
example_before = "goes back"
harm = "A button stops doing what your hand expects, and it may be the one you would use to undo it."

[capability."pointer.host"]
kind = "control"
value = "host number"
summary = "Move the device to another paired computer."
min_risk = "guarded"
ask = "Move the mouse over to my other computer."
example = "other computer"
example_before = "this computer"
harm = "The mouse leaves this computer, so you can no longer use it here to bring it back."

[capability."scroll.mode"]
kind = "control"
value = "ratchet or free-spin"
summary = "How the scroll wheel behaves."
min_risk = "reversible"
ask = "Let the scroll wheel spin freely."
example = "free spin"
example_before = "clicks"

[capability."display.input"]
kind = "control"
value = "input source"
summary = "Which video input the display shows."
min_risk = "guarded"
ask = "Show my other computer on the screen."
example = "other computer"
example_before = "this computer"
harm = "The picture leaves the computer that asked, so you cannot see what you are doing to switch back."

[capability."display.brightness"]
kind = "control"
value = "percent"
summary = "Display brightness."
min_risk = "reversible"
ask = "Dim the screen."
example = "40%"
example_before = "80%"
