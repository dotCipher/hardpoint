# Hardpoint's built-in settings. Nothing here is specific to a device or a
# person. To change them, copy this file to ~/.config/hardpoint/config.toml
# or pass --config. See examples/ for a complete setup.

[device]
# auto: use the first attached keyboard the catalog describes.
# dry:  no hardware; print which keys would be lit.
backend = "auto"
# Pin a particular device card, for example "vendor/model". Empty means auto.
card = ""

# Brightness follows the clock. There are no brightness keys to press.
[brightness]
day = 0.8
night = 0.35
night_start = 21        # local hour, inclusive
night_end = 7           # local hour, exclusive

[lighting]
# release: hand the lights back to the keyboard whenever nothing is active.
# hold:    keep the board on `base` even when idle.
idle = "release"
base = "#0c0a08"        # every key that is not a slot, while Hardpoint has the lights
empty_slot = "#000000"  # an agent slot with no session in it
done_hold_secs = 20     # how long a finished session stays lit
failed_hold_secs = 300

[colors]
running = "#0090ff"
needs-you = "#ffa000"
done = "#00d060"
failed = "#ff3030"

# Slots are the keys Hardpoint may light and listen to. None are set here,
# because which keys are free depends on your keyboard and your layout.
# Add [[slot]] entries in your own config; see examples/.

[sources.opencode]
enabled = true
roots_only = true       # ignore subagent sessions

[sources.socket]
enabled = true          # `hardpoint emit ...`, and any script or hook

[actions]
# A shell command of your own, run when a pressable agent slot is pressed.
# It receives HARDPOINT_SOURCE, HARDPOINT_SESSION, HARDPOINT_TITLE,
# HARDPOINT_DIRECTORY, HARDPOINT_STATE and HARDPOINT_KEY in its environment.
# This is only ever read from your own config file, never from the catalog.
agent_press = ""

[telemetry]
# Per-key press counts per day. Counts only: no order, no timing, no text.
enabled = false

[gate]
# Changes an agent proposes through `hardpoint mcp`.
hold_secs = 10          # a guarded change goes back after this long unless you keep it
approve_secs = 60       # a gated change is dropped after this long unless you approve it
# key = 0               # a key that lights when an answer is wanted; pressing it means yes

# Make a label stricter for one of your own devices. It can only be raised.
# [[stricter]]
# device = "vendor/model"
# capability = "light.global"
# risk = "gated"

[update]
# Fetch new and corrected cards from the project while the daemon runs. By
# itself the catalog can only get stricter: an update that would loosen a
# label waits for you. The program never updates itself.
catalog = false
every_hours = 24

# Keep an eye on a reading. When it crosses its line it shows up on a spare
# key the way an agent that needs you does, and clears when it recovers.
# [[watch]]
# device = "vendor/model"
# capability = "battery.level"
# below = 20                    # or: equals = "Failing"
# say = "Mouse battery is low"
# every_secs = 300

# "When this, set that." A rule goes through the gatekeeper like any change,
# and never makes a gated one. Use `at` for a time of day, or `while` for as
# long as any agent session is in a state (the change is put back afterwards).
# [[rule]]
# at = "20:00"
# device = "vendor/model"
# capability = "display.brightness"
# value = 40
#
# [[rule]]
# while = "needs-you"
# device = "vendor/model"
# capability = "light.global"
# value = "#402000"
