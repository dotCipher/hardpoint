# An example setup for a ZSA Moonlander: the six keys of the two inner
# columns become agent slots. Key numbers are the ones the device card
# declares (see the card's page on the site for a picture).
#
# Copy to ~/.config/hardpoint/config.toml and change the slots to keys that
# are free in your own layout.

[device]
backend = "auto"
card = "zsa/moonlander-mk1"

[brightness]
day = 0.8
night = 0.35
night_start = 21
night_end = 7

[lighting]
idle = "release"
base = "#0c0a08"
empty_slot = "#000000"
done_hold_secs = 20
failed_hold_secs = 300

[colors]
running = "#0090ff"
needs-you = "#ffa000"
done = "#00d060"
failed = "#ff3030"
alert = "#c040ff"

# Optional layer-aware ambient tints (while Hardpoint holds lighting, or
# automatically on non-zero layers so your layer is visible at a glance).
# [lighting.layers]
# "1" = "#081424"
# "2" = "#180a24"
# "3" = "#081c14"

# Optional mapping of the 6 hardware status LEDs (0-2 left half, 3-5 right half).
# Works independently of the key RGB matrix.
# [status_leds]
# running = 0
# needs_you = 1
# waiting = 2
# alert = 3

# Dedicated physical Approve/Keep and Decline keys for Hardpoint's gatekeeper.
# Choose keys you never type on (run `hardpoint heatmap` to find unused keys).
# [gate]
# key = 32
# decline_key = 70

# Only mark a key `pressable` if pressing it is otherwise harmless: nothing
# assigned to it in your layout, or a bare modifier hold.
[[slot]]
key = 36
kind = "agent"
pressable = true

[[slot]]
key = 50
kind = "agent"
pressable = true

[[slot]]
key = 6
kind = "agent"

[[slot]]
key = 13
kind = "agent"

[[slot]]
key = 20
kind = "agent"

[[slot]]
key = 43
kind = "agent"

[sources.opencode]
enabled = true
roots_only = true

[sources.socket]
enabled = true

[actions]
# See examples/focus-session.sh for focusing the matching tmux pane + terminal
# without injecting keystrokes or auto-approving prompts.
agent_press = ""

[telemetry]
# Enable to collect aggregate per-key, per-layer press counts for `hardpoint heatmap`.
# Counts only: never records order, timing or text.
enabled = false
