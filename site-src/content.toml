# The page that asks people to add their own devices.
[add]
title = "Add your device"
lede = "A label is one small file. You do not need to write code, and nothing is changed on your device."
ai_title = "The quick way: give this to an AI coding assistant"
ai_lede = "Paste it into the assistant you already use. It will look at what is plugged in, ask which device you mean, and write the label with you."
copy = "Copy"
copied = "Copied"
hand_title = "Or by hand"
rules_title = "What makes a good label"
issue_title = "Short on time?"
issue_text = "Tell us what you have and paste what the script printed. Someone else can write the label."
issue_link = "Open a device request"

[[add.step]]
say = "Get the files"
run = "git clone {repo} && cd hardpoint"

[[add.step]]
say = "See what is plugged in, and what has no label yet"
run = "python3 tools/observe.py"

[[add.step]]
say = "Start a label for one of them"
run = "python3 tools/observe.py --draft 3"

[[add.step]]
say = "Fill it in, then check it"
run = "python3 tools/build.py --check"

[[add.step]]
say = "Send it in as a pull request"
run = ""

[[add.rule]]
text = "Only say `observed` for something you ran and saw work. Otherwise say `unverified`, and where the claim comes from."

[[add.rule]]
text = "Use words from the shared list. If one is missing, add it in the same change."

[[add.rule]]
text = "A label is information only. It can never contain a command."

[[add.rule]]
text = "Write from what you see and from documentation. Do not copy another project's data files."

# For builders: one worked example per risk level, on the format page. The
# build checks each one against the catalog.
[travel]
title = "Every change takes the same road"
lede = "A client never touches a device. It asks, and the daemon decides what happens from the device's card."
stops = ["Asked", "Card check", "Risk gate", "Device"]
asked = "A client proposes it"
checked = "The card lists it, and the value fits"
confirm = "Keep it"

[[ladder]]
risk = "read"
device = "logitech/mx-master-3"
capability = "battery.level"
gate = "Nothing to guard"
reach = "Value read"
outcome = "The value comes back. Nothing on the device changed."

[[ladder]]
risk = "reversible"
device = "zsa/moonlander-mk1"
capability = "light.per_key"
gate = "Previous value saved"
reach = "Applied"
outcome = "Applied at once. The previous colour is on record, so it can be put back at once."

[[ladder]]
risk = "guarded"
device = "logitech/mx-master-3"
capability = "pointer.dpi"
gate = "Saved, and a timer starts"
reach = "Applied, waiting for you"
outcome = "Applied, then held open. Confirm it, or do nothing and it goes back."
kept = "Confirmed, so it stays."
reverted = "No answer, so it went back."

[[ladder]]
risk = "gated"
device = "zsa/moonlander-mk1"
capability = "firmware.flash"
gate = "Stops here"
reach = "Never reached"
outcome = "Refused. Hardpoint explains the steps; a person presses the reset button."

[ladder_note]
text = "Reading and reversible lighting run today. Confirm-or-revert and the change journal are designed and not built yet."

[[start]]
say = "Build it"
run = "cargo build --release"

[[start]]
say = "See what is attached, and which cards describe it"
run = "./target/release/hardpoint inventory"

[[start]]
say = "Try it with no hardware: it prints which keys would be lit"
run = "./target/release/hardpoint run --device dry --config examples/moonlander.toml"

[[start]]
say = "Report a helper's state from any script or hook"
run = "./target/release/hardpoint emit --source my-tool --session 1 --state needs-you"
