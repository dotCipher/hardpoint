[[question]]
ask = "Does this let an agent control my computer?"
answer = "Yes. That is what it is for: the computer itself and what is attached to it, such as the battery, the screen, the keyboard, the mouse and your drives. What changes is how. Your agent does not make up commands; it works from each device's card, where every ability has a label. Reading is always allowed. Small changes can be put back at once. Changes that could get in your way go back unless you keep them. Changes that cannot be undone, such as a firmware update, wait for your yes."

[[question]]
ask = "What can it do right now?"
answer = "On a Mac, an agent connected with `hardpoint mcp` can reach the computer itself (battery, wear, heat, drive health, volume), a Logitech mouse over Bluetooth (battery, pointer speed, scroll wheel), a display (brightness), headphones, docks and drives (firmware and health), and a keyboard (lights, key presses, agent sessions on spare keys). Changes are made at once and can be undone, or kept or put back, or held until you approve, according to each label. Smart-home devices come next, through Home Assistant. Linux and Windows are not tried yet."

[[question]]
ask = "Does it need any special permission?"
answer = "No account or sudo. On a Mac, some devices need permission from you: Input Monitoring for the mouse, or removable-volume access for an external drive. Hardpoint checks for the host-side tools an attached card needs and installs supported helpers in the background, such as `m1ddc` using existing Homebrew on Apple Silicon. It never grants permissions, installs a package manager, or flashes firmware for you. `hardpoint doctor` explains what is missing; `[tools] auto_install = false` turns automatic setup off."

[[question]]
ask = "Does it replace my device or automation apps?"
answer = "No. Lunar and BetterDisplay already automate displays; OpenLogi and Solaar manage mice; Home Assistant and Hammerspoon handle broader automation. Agent-status lights and Stream Deck approvals exist too. Hardpoint adds a shared card, enforced labels and an undo or approval path for actions sent through it. Today it wraps `m1ddc` on Apple Silicon and has a Linux `ddcutil` path not yet tested on hardware; adapters for those larger apps are planned, not built. Keep one owner for each setting so two automation loops do not fight."

[[question]]
ask = "Which agents does it work with?"
answer = "Bring your own. `hardpoint mcp` speaks the Model Context Protocol, which Claude Code, Codex, OpenCode and most other agents can connect to. It is used from OpenCode; it has not been tried inside Claude Code or Codex yet. Session lights follow OpenCode by themselves, and any agent can report in from its hooks with `hardpoint emit`."

[[question]]
ask = "What stops it doing something I did not want?"
answer = "A card cannot supply code or an install command; helper installation uses trusted recipes built into the program. Every ability has a lowest label, so a card cannot make a risky change harmless. Gated actions wait for your approval of that exact action. These protections apply to requests through Hardpoint: an agent with unrestricted shell or device access can bypass it. Hardpoint is not a sandbox."

[[question]]
ask = "Is it watching what I type?"
answer = "To let you answer with a spare key, it sees which key went down. It does not keep what you type. It keeps a count per key only if you turn that on."

[[question]]
ask = "Does anything leave my computer?"
answer = "Hardpoint has no account or cloud service; the daemon listens locally. Catalog and program updates contact the source repository, and enabled helper setup contacts the package manager's registries. Readings you give your agent follow that agent's privacy settings and may be sent to its model provider. Shared cards contain model facts, not your unit's serial number, address or private name."

[[question]]
ask = "Does it cover smart-home devices?"
answer = "Yes, by working with Home Assistant rather than replacing it. Home Assistant talks to the devices; Hardpoint adds the label and the approval. There are cards for whole classes of thing, such as any outlet, any light and any lock, and for a television, a streaming stick and an air conditioner found by listening to what they announce on the home network. The Home Assistant connection itself is not written yet. Nothing is sent to them to find them. A card never holds an address or the name you gave a device, and when a device announces what it is doing, such as what is playing, the card lets only \"something is playing\" through."

[[question]]
ask = "Will it work with my devices?"
answer = "If they have a card. A card is one small file, and for anything your computer already reports, such as a battery level, a firmware version or a health verdict, it needs no code at all. Paste one prompt into Claude Code or Codex and it writes the card with you. A card in your own `~/.config/hardpoint/cards` folder works straight away, before anyone else has seen it."

