[[start]]
say = "Build it"
run = "cargo build --release"

[[start]]
say = "See what is attached, and which labels describe it"
run = "./target/release/hardpoint inventory"

[[start]]
say = "Try it with no hardware: it prints which keys would be lit"
run = "./target/release/hardpoint run --device dry --config examples/moonlander.toml"

[[start]]
say = "Report a helper's state from any script or hook"
run = "./target/release/hardpoint emit --source my-tool --session 1 --state needs-you"

[[promise]]
title = "Labels are only information"
text = "A label can say what a device is able to do. It can never carry an instruction for your computer to run, and anything unexpected in one is rejected."

[[promise]]
title = "Risk cannot be talked down"
text = "A label cannot claim an ability is safer than the shared list allows. Anything that cannot be undone is never done by software alone."

[[promise]]
title = "It stays on your computer"
text = "There is no account and no server. Only you can send requests to the program."

[[promise]]
title = "A tally, not your typing"
text = "To act on a press it sees which key went down. It keeps a count per key only if you ask, and never the order, the timing or the words."
