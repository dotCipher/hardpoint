[[question]]
ask = "Does this let an AI control my computer?"
answer = "It lets an AI ask. A small program on your own computer decides what happens, using each device's label. Some things it will only ever explain how to do yourself."

[[question]]
ask = "Is it watching what I type?"
answer = "To let you answer by pressing a spare key, it sees which key went down. It does not keep what you type. If you switch it on, it keeps a tally per key, and never the order, the timing or the words."

[[question]]
ask = "Does anything leave my computer?"
answer = "No. There is no account and no server. The labels are files, and the program listens only on your own computer."

[[question]]
ask = "Which AI does it work with?"
answer = "Today it follows one coding assistant directly, and any other tool can report to it with a one-line command. A standard connection that any assistant can use is planned and not built yet."

[[question]]
ask = "Will it work with my devices?"
answer = "Only a handful have labels so far, and one keyboard is fully working. A label is one small file, and the catalog shows exactly what has and has not been checked for each device."

[[question]]
ask = "What does it cost?"
answer = "Nothing. The program and the labels are open for anyone to use, copy and improve."

# For builders: one worked example per risk level, on the format page. The
# build checks each one against the catalog.
[travel]
title = "Every change takes the same road"
lede = "A client never touches a device. It asks, and the daemon decides what happens from the device's card. Pick a risk level to follow one."
stops = ["Asked", "Card check", "Risk gate", "Device"]
asked = "A client proposes it"
checked = "The card lists it, and the value fits"
confirm = "Keep it"

[[ladder]]
risk = "read"
device = "logitech/mx-master-3"
capability = "battery.level"
gate = "Nothing to guard"
reach = "Value read"
outcome = "The value comes back. Nothing on the device changed."

[[ladder]]
risk = "reversible"
device = "zsa/moonlander-mk1"
capability = "light.per_key"
gate = "Previous value saved"
reach = "Applied"
outcome = "Applied at once. The previous colour is on record, so it can be put back at once."

[[ladder]]
risk = "guarded"
device = "logitech/mx-master-3"
capability = "pointer.dpi"
gate = "Saved, and a timer starts"
reach = "Applied, waiting for you"
outcome = "Applied, then held open. Confirm it, or do nothing and it goes back."
kept = "Confirmed, so it stays."
reverted = "No answer, so it went back."

[[ladder]]
risk = "gated"
device = "zsa/moonlander-mk1"
capability = "firmware.flash"
gate = "Stops here"
reach = "Never reached"
outcome = "Refused. Hardpoint explains the steps; a person presses the reset button."

[ladder_note]
text = "Reading and reversible lighting run today. Confirm-or-revert and the change journal are designed and not built yet."

