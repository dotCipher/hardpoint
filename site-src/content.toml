# The words and the demo scripts on the site and in the README. Everything a
# visitor reads comes from here or from the catalog; nothing is written into
# the build script.

name = "Hardpoint"
tagline = "A safety label for everything your AI can touch."
eyebrow = "Open · runs on your own computer"
lede = "AI helpers are starting to do things, not just answer questions. Hardpoint gives each device a plain label: what an AI may look at, what it may change, and what only you can do."
early = "Early project. Today it fully runs one keyboard on a Mac."
early_link = "See what works"

[nav]
devices = "Devices"
how = "How it works"
questions = "Questions"
builders = "For builders"

# The moving pictures at the top. One is generated for every device in the
# catalog, from that device's own card; nothing here names a device.
[scenes]
title = "Ask about a device. Watch what is allowed."
caption = "These are illustrations made from each device's label. The values are examples, not readings from your computer."
you = "You ask"
next = "Next"
pause = "Pause"
play = "Play"
keep = "Keep it"
undo = "Put it back"
kept = "You kept it."
undone = "Back to how it was."
waiting = "Keep this change?"

[why]
eyebrow = "Why it matters"
title = "The same request, with and without a label"
lede = "An AI that is trying to be helpful will do exactly what it was asked. These are the requests in the catalog where that goes wrong."
without = "Without a label"
without_does = "The AI does it straight away."
with = "With Hardpoint"
proof = "This is not hypothetical. One home-automation user asked a voice assistant to \"turn off the office\", meaning the lights, and it also cut power to his server rack."
proof_link = "His write-up"
proof_url = "https://www.joekarlsson.com/blog/local-voice-ai-home-assistant-gpu/"

[labels]
eyebrow = "How it works"
title = "Four labels. Every ability gets one."
lede = "Colour always means the same thing. A device's label cannot claim an ability is safer than it is."
count = "in the catalog today"

[audience]
eyebrow = "Who it is for"
title = "Useful if any of these is you"

[[audience.item]]
title = "You use AI helpers to get work done"
text = "When several are running, the hard part is knowing which one is waiting for you. Spare keys on a keyboard can show it at a glance, and a press answers."

[[audience.item]]
title = "You want to ask your computer about itself"
text = "\"Is my battery wearing out?\" \"Is it running hot?\" Plain questions, plain answers, and nothing is changed by asking."

[[audience.item]]
title = "You make a device, or love one"
text = "Describe it once, in one small file. Every AI tool that reads the catalog then knows how to treat it properly."

# The moving keyboard. It replays what the named device card and example
# setup do together; the build checks that both exist.
[demo]
card = "zsa/moonlander-mk1"
config = "examples/moonlander.toml"
eyebrow = "Working today"
title = "See which AI helper needs you, on keys you never use"
lede = "Each helper gets a spare key. Blue means working, amber means it is waiting for you, green means done, red means something went wrong."
caption = "A replay, not a recording. This runs today on one keyboard. Click a lit key yourself."
loop_secs = 27
pressed = "You pressed the key yourself. That helper would get its answer now."

[[demo.step]]
at = 0.8
session = "Refactor"
state = "running"
say = "A helper starts work. It gets a key, lit blue."

[[demo.step]]
at = 2.6
session = "Tests"
state = "running"
say = "A second helper takes the next key."

[[demo.step]]
at = 4.4
session = "Docs"
state = "running"
say = "A third lands on a key that only shows a light."

[[demo.step]]
at = 6.8
session = "Docs"
state = "needs-you"
say = "It needs an answer, so it moves to a key you can press, and pulses."

[[demo.step]]
at = 10.6
press = true
say = "You press the lit key. It carries on."

[[demo.step]]
at = 13.0
session = "Tests"
state = "done"
say = "One finishes. Green, then it fades."

[[demo.step]]
at = 15.2
session = "Refactor"
state = "failed"
say = "One hits a problem. Red, until you have seen it."

[[demo.step]]
at = 18.6
press = true
say = "A press says you have seen it."

[[demo.step]]
at = 20.6
level = 0.4
say = "In the evening the lights dim by themselves."

[[demo.step]]
at = 23.2
release = true
say = "Nothing is waiting, so the keyboard goes back to normal."

