# The words and the demo scripts on the site. Everything a visitor reads
# comes from here or from the catalog; nothing is written into the build
# script.
#
# Two words are kept apart throughout. A device has a card: everything known
# about it. Each ability on a card has a label: read, reversible, guarded or
# gated.

name = "Hardpoint"
tagline = "Let your agent manage your devices. You stay in charge."
eyebrow = "Open source · runs on your own computer"
lede = "Your agent already works in your files and your terminal. Hardpoint adds your devices: a checked card for each one says what it can read, what it may change, and what needs your yes first."
cta = "Install with your agent"
cta_second = "See the difference"

# Under the buttons at the top: the agents people already use.
[byo]
title = "Bring your own agent"
agents = ["Claude Code", "Codex", "OpenCode", "any LLM with a terminal"]

[nav]
