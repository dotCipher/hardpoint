[[question]]
ask = "Does this let an agent control my computer?"
answer = "Yes. That is what it is for: the computer itself and what is attached to it, such as the battery, the screen, the keyboard, the mouse and your drives. What changes is how. Your agent does not make up commands; it works from each device's card, where every ability has a label. Reading is always allowed. Small changes can be put back at once. Changes that could get in your way go back unless you keep them. Changes that cannot be undone, such as a firmware update, wait for your yes."

[[question]]
ask = "What can it do right now?"
answer = "The device registry is the current source for abilities, labels and verification; the adapter registry supplies routes, platforms and helper requirements. These pages are generated from the registry rather than maintained as a second list here. On your computer, use `hardpoint inventory`, `hardpoint doctor` and the local MCP tools to check actual availability and errors."

[[question]]
ask = "Does it need any special permission?"
answer = "Requirements belong to each card and adapter entry, not a separate permission list here. `hardpoint doctor` reports local helper requirements; actual operations report permission or connection errors. Hardpoint never grants permissions, elevates privileges, bootstraps a package manager or flashes firmware as helper setup. `[tools] auto_install = false` turns automatic helper setup off."

[[question]]
ask = "Does it replace my device or automation apps?"
answer = "No. Hardpoint is a policy and verification layer over device tools, not a replacement for their specialist features. Consult the adapter registry to see which routes exist and their constraints. Keep one owner for each setting so two automation loops do not fight; research examples are not promises that an integration is available."

[[question]]
ask = "Which agents does it work with?"
answer = "Bring your own. `hardpoint mcp` speaks the Model Context Protocol, which Claude Code, Codex, OpenCode and most other agents can connect to. It is used from OpenCode; it has not been tried inside Claude Code or Codex yet. Session lights follow OpenCode, and any agent can report through hooks with `hardpoint emit`. A session-key press runs your configured action; answering a host's question needs a separate integration. Hardpoint device approvals use their own chosen answer key or a person's terminal command."

[[question]]
ask = "What stops it doing something I did not want?"
answer = "A card cannot supply code or an install command; helper installation uses trusted recipes built into the program. Every ability has a lowest label, so a card cannot make a risky change harmless. Gated actions wait for your approval of that exact action. These protections apply to requests through Hardpoint: an agent with unrestricted shell or device access can bypass it. Hardpoint is not a sandbox."

[[question]]
ask = "Is it watching what I type?"
answer = "To let you answer with a spare key, it sees which key went down. It does not keep what you type. It keeps a count per key only if you turn that on."

[[question]]
ask = "Does anything leave my computer?"
answer = "Hardpoint has no account or cloud service; the daemon listens locally. Catalog and program updates contact the source repository, and enabled helper setup contacts the package manager's registries. Readings you give your agent follow that agent's privacy settings and may be sent to its model provider. Shared cards contain model facts, not your unit's serial number, address or private name."

[[question]]
ask = "Does it cover smart-home devices?"
answer = "Check the registry for matching models or class cards and the status of their adapter routes. A card's presence does not establish that control is available. Use the selected card's matching rules, requirements and verification, and keep private network identities out of shared data."

[[question]]
ask = "Will it work with my devices?"
answer = "Start with discovery and the registry, then check the selected operation locally. The add-device prompt lets you choose all uncatalogued devices, all detected devices for review, or specific entries. Existing cards are reused or reviewed rather than duplicated. Your own cards can live in `~/.config/hardpoint/cards` without being published."

