# The words and the demo scripts on the site. Everything a visitor reads
# comes from here or from the catalog; nothing is written into the build
# script.

name = "Hardpoint"
tagline = "Your AI knows the internet. It doesn't know your desk."
eyebrow = "Open catalog · runs on your own computer"
lede = "Ask an AI to dim your screen and it has to guess how. Hardpoint hands it a label for that exact device: what it can read, what it may change, and what it must leave to you."
cta = "See the difference"

[nav]
devices = "Devices"
how = "How it works"
add = "Add a device"
builders = "For builders"

# The moving pictures at the top. One is made for each kind of device in the
# catalog, from the cards of that kind; nothing here names a device.
[scenes]
title = "Ask about a device"
caption = "Made from the labels in the catalog. The answers are examples, not readings from your computer."
you = "You ask"
next = "Next"
pause = "Pause"
play = "Play"
keep = "Keep it"
undo = "Put it back"
kept = "Kept."
undone = "Put back."
waiting = "Keep this change?"

# What a kind of device is called in the scenes. A kind that is not listed
# here is shown under its own name.
[scenes.kinds]
display = "screen"
audio = "headphones"
storage = "external drive"

# What changes when an AI has a label to read. Each row is true of the
# labels themselves, whatever program reads them.
[why]
eyebrow = "The difference"
title = "Why not just ask an AI?"
lede = "An AI that can run commands on your computer can already try to control your devices. This is what changes when it reads a label first."
topic = "What matters"
without = "A standard AI"
with = "With Hardpoint"
try = "Try a risky request"
without_does = "It does it straight away."
proof = "It happens. One person asked a voice assistant to \"turn off the office\", meaning the lights, and it also cut power to his server rack."
proof_link = "His write-up"
proof_url = "https://www.joekarlsson.com/blog/local-voice-ai-home-assistant-gpu/"

[[why.row]]
topic = "Knowing your device"
without = "Searches for how your device works, then guesses. It may find the wrong model."
with = "Reads a label written for that exact model."

[[why.row]]
topic = "Knowing the risk"
without = "Reading a battery and replacing firmware look the same to it: a command to run."
with = "Every ability is rated before anyone asks, with one of the four labels below."

[[why.row]]
topic = "Proof"
without = "Tells you it worked. You cannot check."
with = "Each claim says whether a person tested it on a real device, and links to the record."

[[why.row]]
topic = "Touching the device"
without = "Runs whatever commands it came up with, with your permissions."
with = "A label holds no commands. Only Hardpoint's own program ever touches a device."

[[why.row]]
topic = "When it goes wrong"
without = "If a change locks you out, you are on your own."
with = "A risky change is labelled to go back by itself unless you keep it. The riskiest are left to you."

[[why.row]]
topic = "What it learns"
without = "Gone when the chat ends. The next AI works it out again."
with = "A label is checked once and shared. Everyone with that device gets it, for any AI."

[labels]
eyebrow = "How it works"
title = "Four labels"
lede = "Every ability a device has gets one. The colour always means the same thing."
count = "in the catalog"

# The moving keyboard. It replays what the named device card and example
# setup do together; the build checks that both exist.
[demo]
card = "zsa/moonlander-mk1"
config = "examples/moonlander.toml"
eyebrow = "More than answers"
title = "Your devices can reach you, too"
lede = "A label works both ways. Here each AI helper gets a spare key: it lights up when the helper needs you, and a press is your answer."
caption = "A replay of Hardpoint running a real keyboard from its label. You can click a lit key."
loop_secs = 25
pressed = "You pressed the key. That helper has its answer."

[[demo.step]]
at = 0.8
session = "First helper"
state = "running"
say = "A helper starts work. Its key turns blue."

[[demo.step]]
at = 3.0
session = "Second helper"
state = "running"
say = "A second helper takes the next key."

[[demo.step]]
at = 5.4
session = "Second helper"
state = "needs-you"
say = "It needs an answer. Its key pulses amber."

[[demo.step]]
at = 9.6
press = true
say = "You press the key. It carries on."

[[demo.step]]
at = 12.4
session = "Second helper"
state = "done"
say = "It finishes. Green, then it fades."

[[demo.step]]
at = 15.2
session = "First helper"
state = "failed"
say = "The other hits a problem. Red, until you have seen it."

[[demo.step]]
at = 18.8
press = true
say = "A press says you have seen it."

[[demo.step]]
at = 21.6
release = true
say = "Nothing is waiting, so the keyboard goes back to normal."

[sections]
devices_eyebrow = "The catalog"
devices_title = "Devices with a label"
devices_lede = "The bar shows how much of each label has been checked on a real device."
devices_more = "All devices"
devices_add = "Add yours"
questions_eyebrow = "Questions"
questions_title = "Fair things to ask"
start_title = "Run it"
start_lede = "It builds with Rust and needs no account. The first command works with no supported hardware attached."
replay = "Replay"

[[question]]
ask = "Does this let an AI control my computer?"
answer = "It lets an AI ask. A small program on your own computer decides, using each device's label. Some things it will only ever explain how to do yourself."

[[question]]
ask = "What can it do right now?"
answer = "It finds what is attached to your computer and matches it to a label. It fully runs one keyboard from its label: the lights, the key presses, and AI helpers on spare keys. For the other devices here the labels are written and checked by hand, and the part that acts on them comes next."

[[question]]
ask = "Is it watching what I type?"
answer = "To let you answer with a spare key, it sees which key went down. It does not keep what you type."

[[question]]
ask = "Does anything leave my computer?"
answer = "No. There is no account and no server."

[[question]]
ask = "Will it work with my devices?"
answer = "Only if they have a label, and few do yet. A label is one small file, and adding one takes a few minutes."

# The page that asks people to add their own devices.
[add]
title = "Add your device"
lede = "A label is one small file. You do not need to write code, and nothing is changed on your device."
ai_title = "The quick way: give this to an AI coding assistant"
ai_lede = "Paste it into the assistant you already use. It will look at what is plugged in, ask which device you mean, and write the label with you."
copy = "Copy"
copied = "Copied"
hand_title = "Or by hand"
rules_title = "What makes a good label"
issue_title = "Short on time?"
issue_text = "Tell us what you have and paste what the script printed. Someone else can write the label."
issue_link = "Open a device request"

[[add.step]]
say = "Get the files"
run = "git clone {repo} && cd hardpoint"

[[add.step]]
say = "See what is plugged in, and what has no label yet"
run = "python3 tools/observe.py"

[[add.step]]
say = "Start a label for one of them"
run = "python3 tools/observe.py --draft 3"

[[add.step]]
say = "Fill it in, then check it"
run = "python3 tools/build.py --check"

[[add.step]]
say = "Send it in as a pull request"
run = ""

[[add.rule]]
text = "Only say `observed` for something you ran and saw work. Otherwise say `unverified`, and where the claim comes from."

[[add.rule]]
text = "Use words from the shared list. If one is missing, add it in the same change."

[[add.rule]]
text = "A label is information only. It can never contain a command."

[[add.rule]]
text = "Write from what you see and from documentation. Do not copy another project's data files."

# For builders: one worked example per risk level, on the format page. The
# build checks each one against the catalog.
[travel]
title = "Every change takes the same road"
lede = "A client never touches a device. It asks, and the daemon decides what happens from the device's card."
stops = ["Asked", "Card check", "Risk gate", "Device"]
asked = "A client proposes it"
checked = "The card lists it, and the value fits"
confirm = "Keep it"

[[ladder]]
risk = "read"
device = "logitech/mx-master-3"
capability = "battery.level"
gate = "Nothing to guard"
reach = "Value read"
outcome = "The value comes back. Nothing on the device changed."

[[ladder]]
risk = "reversible"
device = "zsa/moonlander-mk1"
capability = "light.per_key"
gate = "Previous value saved"
reach = "Applied"
outcome = "Applied at once. The previous colour is on record, so it can be put back at once."

[[ladder]]
risk = "guarded"
device = "logitech/mx-master-3"
capability = "pointer.dpi"
gate = "Saved, and a timer starts"
reach = "Applied, waiting for you"
outcome = "Applied, then held open. Confirm it, or do nothing and it goes back."
kept = "Confirmed, so it stays."
reverted = "No answer, so it went back."

[[ladder]]
risk = "gated"
device = "zsa/moonlander-mk1"
capability = "firmware.flash"
gate = "Stops here"
reach = "Never reached"
outcome = "Refused. Hardpoint explains the steps; a person presses the reset button."

[ladder_note]
text = "Reading and reversible lighting run today. Confirm-or-revert and the change journal are designed and not built yet."

[[start]]
say = "Build it"
run = "cargo build --release"

[[start]]
say = "See what is attached, and which cards describe it"
run = "./target/release/hardpoint inventory"

[[start]]
say = "Try it with no hardware: it prints which keys would be lit"
run = "./target/release/hardpoint run --device dry --config examples/moonlander.toml"

[[start]]
say = "Report a helper's state from any script or hook"
run = "./target/release/hardpoint emit --source my-tool --session 1 --state needs-you"
