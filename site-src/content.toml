# What changes when an agent has a card to read. Each row is true of the
# cards themselves, whatever program reads them.
[why]
eyebrow = "The difference"
title = "Why not let the agent work it out?"
lede = "Claude Code, Codex or any LLM with a terminal can already try to control a device: it searches, writes a command and runs it. This is what changes with Hardpoint."
topic = "What matters"
without = "Claude Code, Codex or any LLM agent"
with = "The same agent, with Hardpoint"
try = "Try a risky request"
without_short = "On its own"
with_short = "With Hardpoint"
without_does = "It does it straight away."
proof = "It happens. One person asked a voice assistant to \"turn off the office\", meaning the lights, and it also cut power to his server rack."
proof_link = "His write-up"
proof_url = "https://www.joekarlsson.com/blog/local-voice-ai-home-assistant-gpu/"

[[why.row]]
topic = "Knowing your device"
without = "Has never seen your exact device. It searches, then works from whatever it finds."
with = "Reads a card written for that exact model."

[[why.row]]
topic = "Knowing the risk"
without = "Reading a battery and replacing firmware look the same to it: a command to run."
with = "Every ability on a card has one of four labels, set before anyone asks."

[[why.row]]
topic = "Proof"
without = "Reports what it did. Nothing says whether that was ever checked on your model."
with = "Each claim on a card says whether a person tested it on a real device, and links to the record."

[[why.row]]
topic = "Touching the device"
without = "Writes its own commands and runs them as you."
with = "A card holds no commands. Hardpoint checks the label, then uses a known adapter or helper tool."

[[why.row]]
topic = "When it goes wrong"
without = "If a change locks you out, you are on your own."
with = "A risky change is labelled to go back by itself unless you keep it. One that cannot be undone waits for your yes."

[[why.row]]
topic = "What it learns"
without = "Gone when the session ends. The next agent works it out again."
with = "A card is checked once and shared. Everyone with that device gets it, in any agent."

# What people do with it. Every one of these works today.
[uses]
eyebrow = "What you can do"
title = "What it is good for"
lede = "Each of these works today, on a Mac."

[[uses.item]]
art = "keyboard"
title = "See which agent needs you"
text = "Each agent session takes a spare key: blue while it works, amber when it needs an answer. Press the key to answer."

[[uses.item]]
art = "mouse"
title = "Let your devices raise their hand"
text = "A mouse or laptop running low shows up on the same keys as an agent that needs you. One short entry in your settings for each thing to watch."

[[uses.item]]
art = "storage"
title = "Ask about your hardware"
text = "\"Is heat throttling this computer, is the battery worn, or does the drive report trouble?\" Your agent gathers the readings instead of guessing. A health verdict is not a prediction of failure."

[[uses.item]]
art = "display"
title = "Change things, and take them back"
text = "\"Let the wheel spin freely for this long review, then put it back.\" Your agent reads the original setting, makes the change through its label, and can undo it afterwards."

[[uses.item]]
art = "lighting"
title = "Set it once, as a rule"
text = "\"Glow amber while an agent is waiting on me.\" A short rule uses the same labels and puts the setting back afterwards. Simple clock rules work too; complex automation belongs in your existing tools."

[[uses.item]]
art = "lock"
title = "Try a risky change safely"
text = "Speed the pointer up and it goes back by itself unless you keep it. A change that cannot be undone waits for your yes, on a key or in a terminal."

[[uses.item]]
art = "card"
title = "Add a device in minutes"
text = "If your computer already reports it, a card is all it takes: no code. Paste one prompt and your agent writes the card with you."

[labels]
eyebrow = "How it works"
title = "Four labels"
lede = "Every ability a device has gets one. The colour always means the same thing."
count = "in the catalog"

