# The page with the prompt that has an agent install Hardpoint.
[install]
title = "Install Hardpoint"
lede = "Paste one prompt into your agent. It checks what is needed, builds Hardpoint from source, connects itself to it, and asks you before each choice that is yours."
ai_title = "Paste this into Claude Code, Codex or OpenCode"
ai_lede = "Any agent that can run commands will do. Nothing here needs sudo, and nothing is changed on your devices."
copy = "Copy"
copied = "Copied"
does_title = "What it puts on your computer"
updates_title = "How it stays current"
hand_title = "Or by hand"

[[install.does]]
text = "The program, at `~/.local/bin/hardpoint`, built from source on your own machine"

[[install.does]]
text = "The source and the catalog of device cards, in `~/.local/share/hardpoint`"

[[install.does]]
text = "If you say yes: a login item that keeps it running, and one entry in your agent's own settings so it can use Hardpoint as a tool"

[[install.updates]]
text = "Cards can update themselves once a day, if you turn that on. They are data, never code."

[[install.updates]]
text = "By itself the catalog can only stay as strict or get stricter. An update that would loosen any label waits until you accept it."

[[install.updates]]
text = "The program never updates on its own. `hardpoint update --program` rebuilds it from source when you ask."

[[install.step]]
say = "Get the source"
run = "git clone {repo} ~/.local/share/hardpoint/src && cd ~/.local/share/hardpoint/src"

[[install.step]]
say = "Build it and put it in place"
run = "sh tools/install.sh"

[[install.step]]
say = "Start it now and at every login"
run = "hardpoint service install"

[[install.step]]
say = "Connect your agent (Claude Code shown)"
run = "claude mcp add --scope user hardpoint -- \"$HOME/.local/bin/hardpoint\" mcp"

[[install.step]]
say = "Later: bring the cards up to date"
run = "hardpoint update"

# The page that asks people to add their own devices.
[add]
title = "Add your device"
lede = "A card is one small file. You do not need to write code, and nothing is changed on your device."
ai_title = "The quick way: paste this into Claude Code or Codex"
ai_lede = "Any coding agent will do. It looks at what is plugged in and what is on your home network, asks which device you mean, and writes the card with you."
copy = "Copy"
copied = "Copied"
hand_title = "Or by hand"
rules_title = "What makes a good card"
issue_title = "Short on time?"
issue_text = "Tell us what you have and paste what the script printed. Someone else can write the card."
issue_link = "Open a device request"

[[add.step]]
say = "Get the files"
run = "git clone {repo} && cd hardpoint"

[[add.step]]
say = "See what is plugged in or on your home network, and what has no card yet"
run = "python3 tools/observe.py"

[[add.step]]
say = "Start a card for one of them"
run = "python3 tools/observe.py --draft 3"

[[add.step]]
say = "Fill it in, then check it"
run = "python3 tools/build.py --check"

[[add.step]]
say = "Send it in as a pull request"
run = ""

[[add.rule]]
text = "Only say `observed` for something you ran and saw work. Otherwise say `unverified`, and where the claim comes from."

[[add.rule]]
text = "Use words from the shared list. If one is missing, add it in the same change."

[[add.rule]]
text = "A card is information only. It can never contain a command."

[[add.rule]]
text = "Write from what you see and from documentation. Do not copy another project's data files."

# For builders: one worked example per risk level, on the format page. The
# build checks each one against the catalog.
[travel]
title = "Every change takes the same road"
lede = "A client never touches a device. It asks, and the daemon decides what happens from the device's card."
stops = ["Asked", "Card check", "Risk gate", "Device"]
asked = "A client proposes it"
checked = "The card lists it, and the value fits"
confirm = "Keep it"
approve = "Approve"

[[ladder]]
risk = "read"
device = "logitech/mx-master-3"
capability = "battery.level"
gate = "Nothing to guard"
reach = "Value read"
outcome = "The value comes back. Nothing on the device changed."

[[ladder]]
risk = "reversible"
device = "zsa/moonlander-mk1"
capability = "light.per_key"
gate = "Previous value saved"
reach = "Applied"
outcome = "Applied at once. The previous colour is on record, so it can be put back at once."

[[ladder]]
risk = "guarded"
device = "logitech/mx-master-3"
capability = "pointer.dpi"
gate = "Saved, and a timer starts"
reach = "Applied, waiting for you"
outcome = "Applied, then held open. Confirm it, or do nothing and it goes back."
kept = "Confirmed, so it stays."
reverted = "No answer, so it went back."

[[ladder]]
risk = "gated"
device = "zsa/moonlander-mk1"
capability = "firmware.flash"
gate = "Waits for your yes"
reach = "Done once approved"
outcome = "Made ready, then held. Nothing is sent to the device until you approve this exact action."
approved = "Approved, so it was done. You are told what to press, and when."

[ladder_note]
text = "All four run in the gatekeeper today, on a keyboard's lights: an agent connects with `hardpoint mcp`. Reaching other devices is what comes next."

[[start]]
say = "Build it"
run = "cargo build --release"

[[start]]
say = "See what is attached, and which cards describe it"
run = "./target/release/hardpoint inventory"

[[start]]
say = "Try it with no hardware: it prints which keys would be lit"
run = "./target/release/hardpoint run --device dry --config examples/moonlander.toml"

[[start]]
say = "Let an agent connect, while `hardpoint run` is running"
run = "./target/release/hardpoint mcp"

[[start]]
say = "Report an agent session's state from any script or hook"
run = "./target/release/hardpoint emit --source my-tool --session 1 --state needs-you"
