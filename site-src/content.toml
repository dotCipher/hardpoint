# The words and the demo scripts on the site. Everything a visitor reads
# comes from here or from the catalog; nothing is written into the build
# script.

name = "Hardpoint"
tagline = "A safety label for everything your AI can touch."
eyebrow = "Open · runs on your own computer"
lede = "Each device gets a label: what an AI may read, what it may change, and what only you can do."
early = "Early project. Today it fully runs one keyboard on a Mac."
early_link = "What works"

[nav]
devices = "Devices"
how = "How it works"
add = "Add a device"
builders = "For builders"

# The moving pictures at the top. One is made for every device in the
# catalog from that device's own card; nothing here names a device.
[scenes]
title = "Ask about a device"
caption = "Made from each device's label. The answers are examples, not readings from your computer."
you = "You ask"
next = "Next"
pause = "Pause"
play = "Play"
keep = "Keep it"
undo = "Put it back"
kept = "Kept."
undone = "Put back."
waiting = "Keep this change?"

[why]
eyebrow = "Why it matters"
title = "The same request, with and without a label"
lede = "A helpful AI does exactly what it was asked. Sometimes that is the problem."
without = "Without a label"
without_does = "The AI does it straight away."
with = "With Hardpoint"
proof = "It happens. One person asked a voice assistant to \"turn off the office\", meaning the lights, and it also cut power to his server rack."
proof_link = "His write-up"
proof_url = "https://www.joekarlsson.com/blog/local-voice-ai-home-assistant-gpu/"

[labels]
eyebrow = "How it works"
title = "Four labels"
lede = "Every ability a device has gets one. The colour always means the same thing."
count = "in the catalog"

# The moving keyboard. It replays what the named device card and example
# setup do together; the build checks that both exist.
[demo]
card = "zsa/moonlander-mk1"
config = "examples/moonlander.toml"
eyebrow = "Working today"
title = "See which AI helper needs you"
lede = "Each helper gets a spare key on the keyboard. Press the key to answer."
caption = "A replay of something that runs today on one keyboard. You can click a lit key."
loop_secs = 25
pressed = "You pressed the key. That helper has its answer."

[[demo.step]]
at = 0.8
session = "Refactor"
state = "running"
say = "A helper starts work. Its key turns blue."

[[demo.step]]
at = 3.0
session = "Tests"
state = "running"
say = "A second helper takes the next key."

[[demo.step]]
at = 5.4
session = "Tests"
state = "needs-you"
say = "It needs an answer. Its key pulses amber."

[[demo.step]]
at = 9.6
press = true
say = "You press the key. It carries on."

[[demo.step]]
at = 12.4
session = "Tests"
state = "done"
say = "It finishes. Green, then it fades."

[[demo.step]]
at = 15.2
session = "Refactor"
state = "failed"
say = "The other hits a problem. Red, until you have seen it."

[[demo.step]]
at = 18.8
press = true
say = "A press says you have seen it."

[[demo.step]]
at = 21.6
release = true
say = "Nothing is waiting, so the keyboard goes back to normal."

